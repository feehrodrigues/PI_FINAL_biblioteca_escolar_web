{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner | Biblioteca Inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    #scanner-container {
      position: relative; width: 100%; max-width: 500px; margin: auto; overflow: hidden;
      border-radius: 16px; border: 3px solid var(--border-color); transition: border-color 0.3s ease;
    }
    #scanner-container.success { border-color: #198754; }
    #scanner-container.error { border-color: #dc3545; }
    #scanner-container video { display: block; width: 100%; height: auto; }
    #scanner-container .drawingBuffer { display: none; }
    .laser-line {
        position: absolute; top: 50%; left: 5%; right: 5%; height: 2px;
        background-color: rgba(220, 53, 69, 0.8); box-shadow: 0 0 10px rgba(220, 53, 69, 0.8);
        transform: translateY(-50%); border-radius: 2px; animation: scanning 2s infinite ease-in-out;
    }
    @keyframes scanning { 0%, 100% { top: 20%; } 50% { top: 80%; } }
  </style>
</head>
<!-- O ID e a CLASSE aqui são o que faz os botões funcionarem! -->
<body id="conteudo-principal" class="d-flex flex-column min-vh-100 transition-tema">

  <nav class="navbar navbar-expand-lg py-3 shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bolder logo-text" href="{% url 'index' %}">EMEF Gianfrancesco Guarnieri</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <a href="{% url 'index' %}" class="btn btn-outline-secondary rounded-pill btn-sm">← Voltar ao Acervo</a>
        <div class="vr"></div>
        <div class="acessibilidade-panel d-flex gap-2">
            <button id="btn-contraste" class="btn btn-outline-acessibility rounded-pill btn-sm">🌓 Alto Contraste</button>
            <button id="btn-leitura" class="btn btn-outline-acessibility rounded-pill btn-sm">🔊 Ouvir</button>
            <button id="btn-parar-leitura" class="btn btn-danger rounded-pill btn-sm" style="display: none;">⏹️ Parar</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4 text-center">
            <h3 class="fw-bold mb-1">Scanner de Livros</h3>
            <p class="text-muted small mb-4" id="status-message">Aponte a câmera para o código de barras...</p>
            
            <div id="scanner-container" class="mb-3"><div class="laser-line"></div></div>
            <div id="resultado-feedback" class="mt-2" style="min-height: 50px;"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- O script DEVE ser chamado no final para que os botões existam quando ele rodar -->
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
  <script src="{% static 'js/scanner.js' %}"></script>
  <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
