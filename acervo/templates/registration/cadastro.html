{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastre-se | EMEF Gianfrancesco Guarnieri</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    /* Estilizando o formulário padrão do Django para ficar com visual Bootstrap */
    .django-form input {
        display: block; width: 100%; padding: 0.375rem 0.75rem; 
        font-size: 1rem; line-height: 1.5; color: #212529; 
        background-color: #fff; border: 1px solid #ced4da; 
        border-radius: 0.375rem; margin-top: 5px; margin-bottom: 15px;
    }
    .django-form label { font-weight: bold; }
    .helptext { display: block; font-size: 0.8rem; color: #6c757d; margin-bottom: 10px; }
    .errorlist { color: #dc3545; list-style: none; padding-left: 0; font-size: 0.9rem; font-weight: bold;}
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm p-4 border-0 rounded-4">
          <div class="text-center mb-4">
            <h3 class="fw-bold text-orange">Criar Nova Conta</h3>
            <p class="text-muted small">Cadastre-se para acessar o acervo digital</p>
          </div>
          
          <form method="post" class="django-form">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary rounded-pill">Finalizar Cadastro</button>
              <a href="{% url 'login' %}" class="btn btn-light rounded-pill">Já tenho conta (Entrar)</a>
            </div>
          </form>
          
        </div>
      </div>
    </div>
  </div>
</body>
</html>
