{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login | EMEF Gianfrancesco Guarnieri</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm p-4 border-0 rounded-4">
          <div class="text-center mb-4">
            <h3 class="fw-bold text-orange">Acesso à Biblioteca</h3>
            <p class="text-muted small">Faça login para emprestar livros</p>
          </div>
          
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-bold">Usuário</label>
              <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Senha</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <!-- Substitua os botões do final por estes: -->
            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-search rounded-pill">Entrar</button>
              <a href="{% url 'cadastro' %}" class="btn btn-outline-primary rounded-pill">Não tem conta? Cadastre-se</a>
              <a href="{% url 'index' %}" class="btn btn-light rounded-pill">Voltar ao Acervo</a>
            </div>
          </form>
          
        </div>
      </div>
    </div>
  </div>
</body>
</html>
